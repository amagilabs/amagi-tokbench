[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amagi-tokbench"
version = "0.1.0"
description = "One command to benchmark a local LLM server (Ollama, llama.cpp, vLLM): prompt and generation tokens/sec, time to first token, peak VRAM, written as a markdown + PNG card you can paste anywhere."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AmagiLabs (Amagisolutionsgroup, Inc.)", email = "dev@amagisolutionsgroup.com" }]
requires-python = ">=3.9"
dependencies = ["Pillow>=10.1"]
keywords = ["llm", "benchmark", "ollama", "llama.cpp", "vllm", "tokens-per-second", "gpu", "localllama", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]

[project.urls]
Homepage = "https://github.com/amagilabs/amagi-tokbench"

[project.scripts]
amagi-tokbench = "amagi_tokbench.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amagi_tokbench = ["vendor/*.png", "vendor/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
